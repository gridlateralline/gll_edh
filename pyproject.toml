[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gll_edh"
version = "0.1.0"
authors = [{ name = "ewz - Zurich Municipal Electric Utility" }]
license = { file = "LICENSE" }
description = "Retroactive grid-pricing sandbox for the Energy Data Hackdays 2026"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["energy", "grid", "tariff", "jax", "hackathon"]
dependencies = [
    "gll_env",
    "jax==0.5.3",
    "numpy>=1.26",
    "pandas>=2.2",
]

# gll_env is not published to PyPI. This pin becomes a released tag before the
# repo goes public; until then it tracks the branch carrying the reward
# component. See README, Install.
[tool.uv.sources]
gll_env = { git = "https://github.com/gridlateralline/gll_env.git", branch = "main" }

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "pre-commit",
    "jupyter>=1.1.1",
    "matplotlib>=3.9",
    # jumanji switches the matplotlib backend to ipympl on import inside
    # IPython, so every notebook fails at the first import without it.
    "ipympl>=0.9",
    "nbclient",
    "pyarrow",
]

[tool.hatch.build.targets.wheel]
packages = ["sandbox"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "W", "RUF"]
ignore = ["E731", "A002", "A003", "A005", "B017"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["sandbox", "tests"]

[tool.ty.rules]
# Same suppressions as gll_env, and for the same reason: chex aliases
# (`chex.Array`, `chex.Numeric`) resolve to broad unions whose scalar members
# are not subscriptable, lack JAX's `.at` accessor and do not support array
# operators, so a static checker reports false positives on correct array code.
not-subscriptable = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
# The two seams take deliberately loose signatures so a participant's function
# does not have to be annotated to run.
invalid-method-override = "ignore"
